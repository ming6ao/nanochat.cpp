# nanochat sandbox profiles.
#
# Sourced by tools/sandbox.sh. `sandbox_profile <name>` sets:
#   SB_QUOTA     systemd CPUQuota value (100% == one logical CPU)
#   SB_MEM_HIGH  memory.high (soft: reclaim starts here)
#   SB_MEM_MAX   memory.max  (hard: OOM at this point)
#   SB_PIDS      pids.max    (fork-bomb guard)
#   SB_CPUS      taskset CPU list (cpuset is not delegated under WSL2)
#   SB_RUNTIME   optional runtime cap in seconds; empty means no cap
#
# Host budget: 12 vCPU / 7.7 GiB (WSL2). Headroom is reserved for WSL itself,
# systemd, the Bazel server, and the agent shells, so no profile exceeds the
# aggregate ceiling in sandbox/nanochat.slice. See DESIGN.md section 15.

sandbox_profile() {
  SB_RUNTIME=""
  case "$1" in
    t0-cpu)    SB_QUOTA=200%;  SB_MEM_HIGH=1536M; SB_MEM_MAX=2G; SB_PIDS=128; SB_CPUS=0-1 ;;
    t1-gpu)    SB_QUOTA=200%;  SB_MEM_HIGH=2G;    SB_MEM_MAX=3G; SB_PIDS=128; SB_CPUS=0-1 ;;
    t2-parity) SB_QUOTA=800%;  SB_MEM_HIGH=5G;    SB_MEM_MAX=6G; SB_PIDS=256; SB_CPUS=0-7 ;;
    t3-bench)  SB_QUOTA=1000%; SB_MEM_HIGH=5G;    SB_MEM_MAX=6G; SB_PIDS=256; SB_CPUS=0-11 ;;
    train)     SB_QUOTA=800%;  SB_MEM_HIGH=5G;    SB_MEM_MAX=6G; SB_PIDS=512; SB_CPUS=0-7 ;;
    eval)      SB_QUOTA=400%;  SB_MEM_HIGH=3G;    SB_MEM_MAX=4G; SB_PIDS=128; SB_CPUS=0-3 ;;
    *)         echo "sandbox: unknown profile '$1'" >&2; return 1 ;;
  esac
}
